name: Main branch - pull request approved

on:
  pull_request:
    types: [closed]
    branches: [main]
env:
  PLUGIN_NAME: whmcs-cielo-credit-card
  WORK_DIR: src

jobs:
  encode-build:
    name: "Encode and create new release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3

    - name: Make plugin root directory
      working-directory: ${{env.WORK_DIR}}
      run: "mkdir $PLUGIN_NAME && mv -t ./$PLUGIN_NAME ./modules ./includes"

    - name: Create .zip for source code
      uses: thedoctor0/zip-release@master
      with:
        type: "zip"
        path: ${{ env.PLUGIN_NAME }}
        directory: ${{env.WORK_DIR}}
        filename: ${{ env.PLUGIN_NAME }}.zip

    - name: Bump version and push tag
      id: tag_version
      uses: mathieudutour/github-tag-action@v6.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        custom_tag: "2.9.0"

    - name: Generate new release with encoded source code
      uses: ncipollo/release-action@v1
      with:
        artifacts: ${{env.WORK_DIR}}/${{ env.PLUGIN_NAME }}.zip
        token: ${{ secrets.GITHUB_TOKEN }}
        commit: "main"
        tag: ${{ steps.tag_version.outputs.new_tag }}
        name: Release ${{ steps.tag_version.outputs.new_tag }}
